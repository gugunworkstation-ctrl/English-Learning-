name: Build English Kids Signed Release

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create private release keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/englishkids-release.jks" \
            -storepass "${{ secrets.Acehbesar123 }}" \
            -keypass "${{ secrets.Acehbesar123 }}" \
            -alias englishkids \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=English Kids 5, O=English Kids, C=ID"

      - name: Build unsigned Release APK
        run: gradle :app:assembleRelease

      - name: Find Android Build Tools
        id: tools
        shell: bash
        run: |
          VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "dir=$ANDROID_HOME/build-tools/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign Release APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="EnglishKids5-v1.1.0-release.apk"

          "${{ steps.tools.outputs.dir }}/zipalign" \
            -f -p 4 \
            "$APK" \
            "$RUNNER_TEMP/aligned.apk"

          "${{ steps.tools.outputs.dir }}/apksigner" sign \
            --ks "$RUNNER_TEMP/englishkids-release.jks" \
            --ks-key-alias englishkids \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Verify Signed APK
        shell: bash
        run: |
          APK="EnglishKids5-v1.1.0-release.apk"

          echo "=== SIGNATURE ==="
          "${{ steps.tools.outputs.dir }}/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

         
