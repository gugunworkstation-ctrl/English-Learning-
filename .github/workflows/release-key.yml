name: Create English Kids Release Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore englishkids-release.jks \
            -storepass EnglishKids5Release2026 \
            -keypass EnglishKids5Release2026 \
            -alias englishkids \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=English Kids 5, OU=English Kids, O=English Kids, L=Jakarta, ST=Jakarta, C=ID"

      - name: Verify release keystore
        run: |
          keytool -list \
            -v \
            -keystore englishkids-release.jks \
            -storepass EnglishKids5Release2026

      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: EnglishKids5-Release-Key
          path: englishkids-release.jks
